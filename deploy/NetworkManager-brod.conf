# NetworkManager не должен управлять TUN-интерфейсом Brod (иначе он сбросит адреса, маршруты и DNS).
# brod0 — имя по умолчанию; vpnclient0 — прежнее имя, оставлено, пока не обновлены все установки.
# Установка (нужен sudo; deploy/tun-setup.sh делает это сам):
#   sudo cp deploy/NetworkManager-brod.conf /etc/NetworkManager/conf.d/90-brod.conf
#   sudo systemctl reload NetworkManager
[keyfile]
unmanaged-devices=interface-name:brod0;interface-name:vpnclient0
